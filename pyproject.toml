[project]
name = "kompress-tokens"
version = "0.2.0"
requires-python = ">=3.10"
description = "ML token compression + caveman LLM rewrite for markdown. Preserves frontmatter and code blocks."
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = ["compression", "llm", "token", "markdown", "kompress", "caveman", "onnx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Filters",
]
dependencies = [
    "onnxruntime>=1.18",
    "huggingface_hub>=0.23",
    "transformers>=4.40",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai    = ["openai>=1.0"]
all       = ["anthropic>=0.40", "openai>=1.0"]
test      = ["pytest>=8.0"]

[project.scripts]
kompress_tokens = "kompress_tokens.__main__:main"

[project.urls]
Homepage   = "https://github.com/philippeprados/kompress-tokens"
Repository = "https://github.com/philippeprados/kompress-tokens"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kompress_tokens"]
